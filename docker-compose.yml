services:
  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api/v1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://namecard_user:${POSTGRES_PASSWORD}@db:5432/namecard
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=["https://name.nozyjp.com"]
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - IMAGE_DIR=/app/uploads/images
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OCR_PROVIDER=${OCR_PROVIDER:-ndl}
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://ocr:8100}
      - VERTEX_PROJECT=${VERTEX_PROJECT:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-global}
      - VERTEX_MODEL=${VERTEX_MODEL:-gemini-3.1-flash-lite}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/vertex-sa.json
      - OCR_STRICT_FAILURE=${OCR_STRICT_FAILURE:-false}
      - OCR_TIMEOUT_SECONDS=${OCR_TIMEOUT_SECONDS:-30}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - upload_data:/app/uploads
      - ./secrets/vertex-sa.json:/app/secrets/vertex-sa.json:ro
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started
    restart: unless-stopped

  # 日本語・縦書き対応の OCR（NDLOCR-Lite）。画像はこのコンテナ内だけで処理し、保存しない。
  ocr:
    build:
      context: ./ocr-service
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    command: postgres -c shared_preload_libraries=pg_bigm
    environment:
      POSTGRES_USER: namecard_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: namecard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namecard_user -d namecard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
